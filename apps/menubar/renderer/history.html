<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>SARAH — Histórico</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #060a14;
        color: #dce6f5;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Helvetica Neue",
          sans-serif;
      }
      body {
        padding: 10px 12px;
        overflow-y: auto;
      }
      h1 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #5b7bab;
        margin: 18px 0 10px;
        font-weight: 600;
      }
      h1:first-child {
        margin-top: 0;
      }

      /* --- conversa (Fase 4 parte 2: migrou da janela principal, que
         não lista mais mensagens por padrão) --------------------- */
      .row {
        display: flex;
        margin-bottom: 10px;
      }
      .row.user {
        justify-content: flex-end;
      }
      .row.sarah,
      .row.erro {
        justify-content: flex-start;
      }
      .bubble {
        max-width: 82%;
        padding: 7px 10px;
        border-radius: 8px;
        font-size: 12.5px;
        line-height: 1.42;
      }
      .row.user .bubble {
        background: #1b2740;
        color: #cdd8ec;
        border-radius: 10px 10px 2px 10px;
      }
      .row.sarah .bubble {
        background: linear-gradient(180deg, #0d1830 0%, #0a1424 100%);
        border-left: 2px solid #3b82f6;
        border-radius: 2px 10px 10px 10px;
      }
      .row.erro .bubble {
        background: #2a1220;
        border-left: 2px solid #f87171;
        border-radius: 2px 10px 10px 10px;
        color: #f3b4b4;
      }
      .bubble .text {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .bubble .tools {
        margin-top: 5px;
        padding-top: 5px;
        border-top: 1px solid rgba(125, 211, 252, 0.15);
        font-size: 10px;
        color: #7dabe0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .bubble .tools .chip.high {
        color: #f5b971;
      }
      /* Fase 7 parte 3: âmbar entre o verde (implícito, baixo risco,
         sem classe extra) e o laranja de alto risco acima. */
      .bubble .tools .chip.medium {
        color: #f5db71;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th {
        text-align: left;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #5b7bab;
        padding: 4px 6px;
        border-bottom: 1px solid #142138;
      }
      td {
        padding: 6px 6px;
        border-bottom: 1px solid #0f1a2e;
        vertical-align: top;
      }
      td.tool {
        color: #cdd8ec;
        word-break: break-word;
      }
      td.time {
        color: #6b87ae;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 10.5px;
      }
      .risk-low {
        background: #0f2a1c;
        color: #7fe0a8;
      }
      /* Fase 7 parte 3: âmbar entre verde (baixo) e laranja (alto). */
      .risk-medium {
        background: #2a260f;
        color: #f5db71;
      }
      .risk-high {
        background: #2a1c0f;
        color: #f5b971;
      }
      .decision-auto-allow {
        background: #0f2a1c;
        color: #7fe0a8;
      }
      .decision-confirmed {
        background: #10203f;
        color: #7dabe0;
      }
      .decision-denied {
        background: #2a1220;
        color: #f3b4b4;
      }
      #empty {
        opacity: 0.5;
        font-size: 12px;
        padding: 20px 0;
      }
    </style>
  </head>
  <body>
    <h1>Conversa</h1>
    <div id="conversation"></div>
    <h1>Últimas ações (Gateway)</h1>
    <div id="content"></div>
    <script type="module" src="history.js"></script>
  </body>
</html>
