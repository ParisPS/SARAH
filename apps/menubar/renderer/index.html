<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>SARAH</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070d;
        color: #dce6f5;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Helvetica Neue",
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* --- holograma: mais espaço ao redor, como a referência ------- */
      #hologram-wrap {
        position: relative;
        height: 250px;
        flex-shrink: 0;
        background:
          radial-gradient(ellipse at center, rgba(60, 130, 246, 0.16) 0%, rgba(5, 7, 13, 0) 68%),
          #05070d;
        border-bottom: 1px solid #10192c;
      }
      #hologram {
        width: 100%;
        height: 100%;
        display: block;
      }
      #hologram-label {
        position: absolute;
        left: 14px;
        bottom: 10px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #5b7bab;
        pointer-events: none;
      }

      /* --- painéis do dashboard ------------------------------------- */
      #dashboard {
        flex-shrink: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: #10192c;
        border-bottom: 1px solid #10192c;
      }
      .panel {
        background: #070b14;
        padding: 10px 12px;
      }
      .panel h2 {
        margin: 0 0 8px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #5b7bab;
        font-weight: 600;
      }

      /* status das integrações */
      .integration-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        padding: 3px 0;
      }
      .integration-row .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .integration-row .dot.ok {
        background: #4ade80;
        box-shadow: 0 0 5px 0 rgba(74, 222, 128, 0.7);
      }
      .integration-row .dot.off {
        background: #6b7280;
      }
      .integration-row .name {
        flex: 1;
        color: #cdd8ec;
      }
      .integration-row .detail {
        font-size: 10px;
        color: #5b7bab;
      }

      /* risco */
      #risk-bar {
        display: flex;
        height: 14px;
        border-radius: 4px;
        overflow: hidden;
        background: #10192c;
        margin-bottom: 6px;
      }
      #risk-bar .low {
        background: #3b82f6;
      }
      #risk-bar .high {
        background: #f5b971;
      }
      .risk-legend {
        display: flex;
        gap: 14px;
        font-size: 11px;
        color: #9fb4d4;
      }
      .risk-legend .swatch {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin-right: 4px;
      }
      .risk-legend .swatch.low {
        background: #3b82f6;
      }
      .risk-legend .swatch.high {
        background: #f5b971;
      }

      /* atividade por categoria */
      .category-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        margin-bottom: 5px;
      }
      .category-row .label {
        width: 108px;
        flex-shrink: 0;
        color: #9fb4d4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .category-row .track {
        flex: 1;
        height: 8px;
        background: #10192c;
        border-radius: 3px;
        overflow: hidden;
      }
      .category-row .fill {
        height: 100%;
        background: linear-gradient(90deg, #2f5a94, #5fa8f5);
      }
      .category-row .count {
        width: 18px;
        text-align: right;
        color: #6b87ae;
        font-variant-numeric: tabular-nums;
      }

      /* atividade recente (gráfico) */
      #activity-chart {
        display: block;
      }

      .empty-panel {
        font-size: 11px;
        color: #4a5f80;
        padding: 4px 0;
      }

      /* --- conversa --------------------------------------------------- */
      #conversation {
        flex: 1;
        overflow-y: auto;
        padding: 10px 12px;
        min-height: 80px;
      }
      #conversation:empty::before {
        content: "Peça algo pra SARAH — ex.: \"me dê um ping com a mensagem oi\" ou \"finja apagar o arquivo teste.txt\".";
        opacity: 0.4;
        font-size: 12px;
      }
      .row {
        display: flex;
        margin-bottom: 12px;
      }
      .row.user {
        justify-content: flex-end;
      }
      .row.sarah,
      .row.erro {
        justify-content: flex-start;
      }
      .bubble {
        max-width: 78%;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.42;
      }
      .row.user .bubble {
        background: #1b2740;
        color: #cdd8ec;
        border-radius: 10px 10px 2px 10px;
      }
      .row.sarah .bubble {
        background: linear-gradient(180deg, #0d1830 0%, #0a1424 100%);
        border-left: 2px solid #3b82f6;
        border-radius: 2px 10px 10px 10px;
        box-shadow: 0 0 12px -4px rgba(59, 130, 246, 0.45);
      }
      .row.erro .bubble {
        background: #2a1220;
        border-left: 2px solid #f87171;
        border-radius: 2px 10px 10px 10px;
        color: #f3b4b4;
      }
      .bubble .text {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .bubble .tools {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid rgba(125, 211, 252, 0.15);
        font-size: 10.5px;
        letter-spacing: 0.02em;
        color: #7dabe0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .bubble .tools .chip.high {
        color: #f5b971;
      }

      /* --- input -------------------------------------------------- */
      #inputRow {
        border-top: 1px solid #10192c;
        padding: 8px;
        flex-shrink: 0;
      }
      #promptInput {
        width: 100%;
        padding: 7px 9px;
        border-radius: 6px;
        border: 1px solid #1c2c4a;
        background: #0b1322;
        color: #dce6f5;
        font-size: 13px;
        outline: none;
      }
      #promptInput:focus {
        border-color: #3b82f6;
      }
      #promptInput:disabled {
        opacity: 0.45;
      }

      #conversation::-webkit-scrollbar {
        width: 8px;
      }
      #conversation::-webkit-scrollbar-thumb {
        background: #1c2c4a;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="hologram-wrap">
      <canvas id="hologram"></canvas>
      <div id="hologram-label">SARAH</div>
    </div>

    <div id="dashboard">
      <div class="panel" id="panel-integrations">
        <h2>Status das integrações</h2>
        <div class="body"></div>
      </div>
      <div class="panel" id="panel-risk">
        <h2>Proporção de risco</h2>
        <div class="body"></div>
      </div>
      <div class="panel" id="panel-categories">
        <h2>Atividade por categoria</h2>
        <div class="body"></div>
      </div>
      <div class="panel" id="panel-activity">
        <h2>Atividade recente (24h)</h2>
        <div class="body"></div>
      </div>
    </div>

    <div id="conversation"></div>
    <div id="inputRow">
      <input id="promptInput" type="text" placeholder="Peça algo pra SARAH..." autofocus />
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
