<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>SARAH</title>
    <style>
      * {
        box-sizing: border-box;
      }

      /* --- paleta (Fase 4 parte 2, etapa 2): variáveis únicas pra
         cores/tons já em uso no resto da interface — não é uma
         paleta nova, é a MESMA (azul/ciano holográfico) só nomeada,
         pra widget de status/legenda/ícones novos nunca driftarem pra
         um tom fora do que o holograma e os painéis já usam. -------- */
      :root {
        --bg: #05070d;
        --ink: #dce6f5;
        --accent: #3b82f6;
        --accent-bright: #5fa8f5;
        --accent-glow: rgba(95, 168, 245, 0.4);
        --muted: #5b7bab;
        --muted-dim: #4a5f80;
        --card-border: #16233d;
        --danger: #f87171;
        --risk-high: #f5b971;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Helvetica Neue",
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* --- cantos estilo HUD (Fase 4 parte 2, etapa 2, item "mais
         tech"): mesmo motivo visual reaproveitado em qualquer elemento
         que precise ler como "leitura de instrumento" — usado só no
         holograma e no widget de status, de propósito, pra não virar
         ruído repetido em toda a tela. ----------------------------- */
      .hud-corners {
        position: relative;
      }
      .hud-corners::before,
      .hud-corners::after {
        content: "";
        position: absolute;
        width: 13px;
        height: 13px;
        border: 1px solid var(--accent-bright);
        opacity: 0.5;
        pointer-events: none;
      }
      .hud-corners::before {
        top: -1px;
        left: -1px;
        border-right: none;
        border-bottom: none;
      }
      .hud-corners::after {
        bottom: -1px;
        right: -1px;
        border-left: none;
        border-top: none;
      }

      /* --- composição (Fase 4 parte 2, etapa 2 — corrige espaço vazio
         apontado pelo usuário): `#top` (esfera + os quatro cards) vira
         `flex: 1` dentro da coluna do body, preenchendo TODA a altura
         disponível até a barra de legenda/controles — nunca mais uma
         faixa preta vazia entre o dashboard e o rodapé. Os cards
         acompanham (`.dash-col`/`.panel` com `flex: 1`, ver abaixo),
         então crescem junto em vez de deixar o espaço extra sobrando
         no meio. --------------------------------------------------- */
      #top {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-columns: 220px 1fr 220px;
        gap: 18px;
        align-items: stretch;
        /* padding-top reserva espaço pro widget de status (pill
           isolada, canto superior direito, fora deste grid) — achado
           real testando com o usuário: com `#status-widget` em
           `position: absolute` e o grid começando logo no topo, a
           pill sobrepunha o card "Atividade por categoria". Em vez de
           tentar "acertar" um deslocamento aproximado, o padding-top
           é maior que a altura real da pill (~34px) + a folga do
           `top: 14px` dela, garantindo ZERO sobreposição mesmo que o
           conteúdo da pill mude de tamanho (ex.: texto de localização
           mais longo não muda a ALTURA, só a largura). */
        padding: 58px 22px 10px;
        background:
          radial-gradient(ellipse at center, rgba(60, 130, 246, 0.18) 0%, rgba(5, 7, 13, 0) 72%),
          var(--bg);
        border-bottom: 1px solid var(--card-border);
      }
      .dash-col {
        display: flex;
        flex-direction: column;
        /* Fase 4 parte 2, etapa 2, ajuste 3 — achado comparando com o
           mockup de novo: `.panel` esticando com `flex: 1` (ajuste
           anterior, pra eliminar o vazio ENTRE o dashboard e os
           controles) fazia sentido pro container `#top` como um todo,
           mas deixava os cards com POUCO conteúdo (Integrações, Risco)
           enormes, com muito espaço vazio dentro deles mesmos — não é
           o mesmo problema, e a correção certa é diferente: os cards
           voltam a ter altura de conteúdo (`.panel` abaixo), e é a
           COLUNA que centraliza o par de cards no meio do espaço
           disponível — o fundo (gradiente do próprio `#top`) continua
           preenchendo qualquer sobra, então nunca volta a parecer um
           vazio "quebrado", é parte da composição. */
        justify-content: center;
        gap: 14px;
        min-width: 0;
        min-height: 0;
      }
      #hologram-wrap {
        position: relative;
        height: 100%;
        min-height: 260px;
      }
      #hologram {
        width: 100%;
        height: 100%;
        display: block;
      }
      #hologram-label {
        /* Fase 4 (Voz), parte 2, ajuste 4: movido pra CIMA da esfera
           (`top`, não mais `bottom`) — pedido explícito do usuário. */
        position: absolute;
        left: 6px;
        top: 6px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        pointer-events: none;
      }

      /* --- painéis do dashboard: cartões com altura de CONTEÚDO
         (`flex: 0 0 auto`, ajuste 3 — ver `.dash-col` acima pro porquê
         de ter voltado atrás do `flex: 1` do ajuste anterior). O vazio
         entre o dashboard e os controles continua resolvido, só que na
         camada de cima (`#top` preenchendo a janela inteira) — os
         cards em si não precisam mais esticar pra isso. ------------- */
      .panel {
        display: flex;
        flex-direction: column;
        flex: 0 0 auto;
        min-height: 0;
        background: linear-gradient(180deg, rgba(19, 31, 54, 0.8) 0%, rgba(9, 14, 25, 0.8) 100%);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 14px 15px;
        box-shadow: 0 14px 30px -20px rgba(0, 0, 0, 0.75);
      }
      .panel h2 {
        margin: 0 0 9px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        font-weight: 600;
        flex-shrink: 0;
      }
      .panel .body {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 0;
      }

      /* status das integrações */
      .integration-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        padding: 3px 0;
      }
      .integration-row .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .integration-row .dot.ok {
        /* Verde genérico trocado pela cor de acento (Fase 4 parte 2,
           etapa 2, ajuste 2) — o mesmo ciano usado na esfera/painéis
           em vez de um verde de "status" fora da paleta da interface. */
        background: var(--accent-bright);
        box-shadow: 0 0 5px 0 var(--accent-glow);
      }
      .integration-row .dot.off {
        background: #6b7280;
      }
      .integration-row .name {
        flex: 1;
        color: #cdd8ec;
      }
      .integration-row .detail {
        font-size: 10px;
        color: var(--muted);
      }

      /* erros recentes (Fase 7 parte 2) — mesmo padrão visual de
         `.integration-row` (linha compacta, cor de acento à esquerda),
         só que a "dot" usa a cor de risco alto (`--risk-high`, laranja
         já usada no donut de risco) em vez do ciano de "ok", pra
         reforçar visualmente que isto é sempre uma falha real, nunca
         um status neutro. */
      .error-row {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        font-size: 11px;
        padding: 4px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .error-row:last-child {
        border-bottom: none;
      }
      .error-row .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
        margin-top: 4px;
        background: var(--risk-high);
      }
      .error-row .content {
        flex: 1;
        min-width: 0;
      }
      .error-row .tool {
        color: #cdd8ec;
        font-weight: 600;
      }
      .error-row .message {
        color: var(--muted);
        font-size: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      /* risco — Fase 4 parte 2, etapa 2, ajuste 2: virou um donut de
         verdade (dois arcos reais, via `stroke-dasharray` em duas
         `<circle>` sobrepostas — sem lib de gráfico nova), no lugar da
         barra horizontal anterior, seguindo o mockup de referência.
         `dashboard.js` (`renderRisk`) monta o SVG; aqui só o estilo. */
      .risk-donut-wrap {
        position: relative;
        /* Aumentado (ajuste 3, comparando com o mockup) — no tamanho
           anterior (92px) a porcentagem central ficava comprimida
           demais pro texto. */
        width: 122px;
        height: 122px;
        margin: 4px auto;
        flex-shrink: 0;
      }
      #risk-donut {
        display: block;
        width: 100%;
        height: 100%;
      }
      .risk-donut-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .risk-donut-pct {
        font-size: 25px;
        font-weight: 700;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .risk-donut-label {
        margin-top: 4px;
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .risk-legend {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin-top: 10px;
        font-size: 11px;
        color: #9fb4d4;
        font-variant-numeric: tabular-nums;
      }
      .risk-legend .swatch {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin-right: 4px;
      }
      .risk-legend .swatch.low {
        background: var(--accent-bright);
      }
      .risk-legend .swatch.high {
        background: var(--risk-high);
      }

      /* atividade por categoria */
      .category-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        margin-bottom: 5px;
      }
      .category-row .label {
        width: 74px;
        flex-shrink: 0;
        color: #9fb4d4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .category-row .track {
        flex: 1;
        height: 8px;
        background: #10192c;
        border-radius: 3px;
        overflow: hidden;
      }
      .category-row .fill {
        height: 100%;
        background: linear-gradient(90deg, #2f5a94, var(--accent-bright));
      }
      .category-row .count {
        width: 18px;
        text-align: right;
        color: #6b87ae;
        font-variant-numeric: tabular-nums;
      }

      /* atividade recente (gráfico) — Fase 4 parte 2, etapa 2, ajuste
         2: voltou a ter altura FIXA e compacta (pedido explícito do
         usuário, comparando com o mockup — todos os 4 cards devem
         ficar do MESMO tamanho, não um esticando mais que os outros
         conforme o conteúdo). A tentativa anterior (`height: 100%`,
         preenchendo o painel inteiro) fazia esse card específico
         "crescer" de um jeito visualmente diferente dos outros três. */
      #activity-chart {
        display: block;
        width: 100%;
        height: 54px;
      }

      .empty-panel {
        font-size: 11px;
        color: var(--muted-dim);
        padding: 4px 0;
      }

      /* --- área de legenda (Fase 4 parte 2, etapa 2 — deixou de ser
         um espaço vazio de "respiro" e virou um propósito real:
         mostra o status atual (ouvindo/pensando) e, depois de cada
         resposta, o TEXTO da resposta + um link clicável quando ela
         contém uma URL ou caminho de arquivo real gerado pela SARAH —
         sem precisar abrir o painel de Histórico só pra clicar em
         algo que acabou de ser criado. `renderer.js` decide o
         conteúdo; aqui só o estilo. ---------------------------------*/
      #stage {
        flex-shrink: 0;
        min-height: 58px;
        max-height: 108px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 26px;
        border-top: 1px solid var(--card-border);
        background: linear-gradient(180deg, rgba(9, 14, 25, 0) 0%, rgba(9, 14, 25, 0.55) 100%);
      }
      #stage-content {
        width: 100%;
        max-width: 560px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        text-align: center;
      }
      #stage-content.hint {
        font-size: 12px;
        color: var(--muted-dim);
        line-height: 1.5;
      }
      #stage-content.status {
        font-size: 12.5px;
        color: var(--accent-bright);
        letter-spacing: 0.02em;
      }
      #stage-content .response-text {
        font-size: 12.5px;
        color: #cdd8ec;
        line-height: 1.45;
        max-height: 54px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      #stage-content .link-chip {
        border: 1px solid var(--accent);
        background: #0f2143;
        color: var(--accent-bright);
        font-size: 11px;
        padding: 5px 12px;
        border-radius: 14px;
        cursor: pointer;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #stage-content .link-chip:hover {
        border-color: var(--accent-bright);
        background: #143059;
      }

      /* --- widget de status (Fase 4 parte 2, etapa 2, ajuste 2 —
         segue o mockup de referência): pill ISOLADA no canto superior
         direito, linha única com divisores finos entre grupos — antes
         eram duas linhas empilhadas dentro de uma área sem fundo
         próprio, que colidia visualmente com o card ao lado (ver
         `padding-top` de `#top` acima, que reserva o espaço). Data/hora
         sempre disponíveis (não dependem de rede nem permissão
         nenhuma); clima e localização vêm de uma única chamada IPC
         (`window.sarah.weather()`, localização por IP + Open-Meteo,
         ver `main-process.ts` — achado real registrado lá sobre por
         que não é mais via geolocalização do sistema) — até responder,
         mostram um texto neutro em vez de ficarem em branco. --------*/
      #status-widget {
        position: absolute;
        top: 14px;
        right: 20px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 15px;
        border-radius: 20px;
        background: rgba(11, 19, 34, 0.78);
        border: 1px solid var(--card-border);
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        pointer-events: none;
        white-space: nowrap;
      }
      #status-widget .sep {
        width: 1px;
        height: 11px;
        background: var(--card-border);
        flex-shrink: 0;
      }
      #status-time {
        color: var(--ink);
        font-weight: 600;
      }
      #status-weather-wrap {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--accent-bright);
      }
      #status-weather-wrap svg {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
      }
      #status-location {
        color: var(--muted);
      }

      /* --- animação de tarefa no NÚCLEO da esfera (Fase 4 parte 4,
         corrigido) ------------------------------------------------
         Correção do usuário: a animação por categoria de tool NÃO
         acontece no selo abaixo da mensagem (que continua só texto,
         ver `.chip`/`.chip-icon` acima) — acontece centralizada sobre
         o NÚCLEO da esfera holográfica. `#core-task` é um overlay 2D
         posicionado exatamente sobre o centro do canvas (onde o
         núcleo 3D sempre está, já que ele fica na origem da cena e a
         câmera aponta pra lá) — a REAÇÃO do núcleo 3D em si (cresce/
         brilha, ver `renderer/hologram.js`) acontece por baixo, ao
         mesmo tempo, então a leitura é "o núcleo se transforma", não
         "um ícone flutuando na frente dele". `renderer.js` decide
         QUANDO trocar o conteúdo/classe daqui, via os callbacks
         `onTaskStart`/`onTaskEnd` de `createHologram()` — nunca duas
         animações ao mesmo tempo (a fila fica inteira dentro de
         `hologram.js`, ver `playTask()`). */
      #core-task {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        /* Preto, a pedido do usuário: o glow/núcleo por baixo é
           branco/azul-claro e "apagava" qualquer glifo branco. Duas
           `drop-shadow` claras empilhadas (em vez de uma cor de traço
           clara) dão um contorno sutil só onde o SVG tem traço —
           mantém o ícone legível tanto sobre o núcleo brilhante
           quanto sobre o fundo escuro por trás dele. */
        color: #05070a;
        filter:
          drop-shadow(0 0 2px rgba(234, 244, 255, 0.9))
          drop-shadow(0 0 2px rgba(234, 244, 255, 0.9));
      }
      #core-task:empty {
        display: none;
      }

      /* Gmail send_draft: envelope "voando" pra fora do núcleo — a
         ação mais consequente do projeto, é a mais elaborada de
         propósito. */
      #core-task.core-task-gmail-send svg {
        animation: core-task-send 3s ease-in-out;
      }
      @keyframes core-task-send {
        0% {
          opacity: 0;
          transform: translate(-4px, 3px) scale(0.6) rotate(-6deg);
        }
        12% {
          opacity: 1;
          transform: translate(0, 0) scale(1) rotate(0deg);
        }
        55% {
          opacity: 1;
          transform: translate(0, 0) scale(1) rotate(0deg);
        }
        90% {
          opacity: 0;
          transform: translate(64px, -44px) scale(0.45) rotate(18deg);
        }
        100% {
          opacity: 0;
        }
      }

      /* Apple Calendar / Notion Calendar create_event: "carimbo" de
         check batendo no centro do núcleo. */
      #core-task.core-task-calendar-stamp svg {
        animation: core-task-stamp 3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      #core-task.core-task-calendar-stamp .core-task-check {
        stroke-dasharray: 34;
        stroke-dashoffset: 34;
        animation: core-task-check-draw 1.1s ease-out 0.55s forwards;
      }
      @keyframes core-task-stamp {
        0% {
          opacity: 0;
          transform: scale(2) translateY(-14px) rotate(-8deg);
        }
        16% {
          opacity: 1;
          transform: scale(0.92) translateY(1px) rotate(2deg);
        }
        26% {
          transform: scale(1.05) rotate(-1deg);
        }
        34% {
          transform: scale(1) rotate(0deg);
        }
        84% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
        100% {
          opacity: 0;
          transform: scale(1) rotate(0deg);
        }
      }
      @keyframes core-task-check-draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      /* Apple Notes / Apple Reminders (criar): traço de caneta
         "escrevendo" no centro do núcleo. */
      #core-task.core-task-writing svg {
        animation: core-task-write-fade 3s ease-in-out;
      }
      #core-task.core-task-writing .core-task-pen {
        transform-origin: 60% 60%;
        animation: core-task-pen-wiggle 0.5s ease-in-out infinite;
      }
      #core-task.core-task-writing .core-task-stroke-line {
        stroke-dasharray: 26;
        stroke-dashoffset: 26;
        animation: core-task-line-draw 1.6s ease-out 0.3s forwards;
      }
      @keyframes core-task-write-fade {
        0% {
          opacity: 0;
          transform: translateY(4px) scale(0.85);
        }
        10% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        82% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes core-task-pen-wiggle {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        25% {
          transform: translate(-1px, 1px) rotate(-4deg);
        }
        50% {
          transform: translate(1px, -1px) rotate(3deg);
        }
        75% {
          transform: translate(-1px, 0) rotate(-2deg);
        }
      }
      @keyframes core-task-line-draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      /* --- controles (Fase 4 parte 2, voz): microfone SEMPRE visível,
         toggle de idioma de SAÍDA, e um ícone pequeno que EXPANDE o
         campo de texto — não mais uma caixa sempre visível. Uma linha
         só, centralizada, discreta — a esfera continua sendo o
         elemento dominante da tela. Ícones viraram SVG na etapa 2
         (mesmo traço monocromático dos glifos de tarefa do núcleo),
         trocando os emojis ⌨️/🎤 iniciais. ---------------------------*/
      #controls {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 18px 18px;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid #1c2c4a;
        background: #0b1322;
        color: #cdd8ec;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.15s;
      }
      .icon-btn svg {
        width: 17px;
        height: 17px;
      }
      .icon-btn:hover {
        border-color: var(--accent);
      }
      .icon-btn:active {
        transform: scale(0.94);
      }
      .icon-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      /* Microfone: destacado com a cor de acento por padrão (não só no
         hover) — é o método de entrada primário desta interface (ver
         mockup de referência), então o botão precisa ler como
         "principal" mesmo em repouso, diferente do ícone de teclado
         (secundário, contorno neutro). */
      #micBtn {
        border-color: var(--accent);
        color: var(--accent-bright);
        box-shadow: 0 0 10px var(--accent-glow);
      }
      #micBtn:hover {
        border-color: var(--accent-bright);
      }
      /* Microfone GRAVANDO: vermelho pulsante — feedback claro além da
         cor "ouvindo" da própria esfera, pro botão em si já deixar
         óbvio que um clique de novo vai PARAR a gravação. `currentColor`
         no SVG faz o traço do ícone acompanhar esta cor automaticamente. */
      #micBtn.recording {
        background: #3a0f14;
        border-color: var(--danger);
        color: var(--danger);
        animation: mic-pulse 1.1s ease-in-out infinite;
      }
      @keyframes mic-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.45);
        }
        50% {
          box-shadow: 0 0 0 7px rgba(248, 113, 113, 0);
        }
      }

      #promptInput {
        width: 0;
        min-width: 0;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 19px;
        background: #0b1322;
        color: var(--ink);
        font-size: 13px;
        outline: none;
        opacity: 0;
        transition:
          width 0.18s ease,
          opacity 0.15s ease,
          padding 0.18s ease;
      }
      /* Expandido (ícone de teclado clicado) — só então vira uma caixa
         de verdade, com largura/padding reais. */
      #promptInput.expanded {
        width: 260px;
        padding: 9px 12px;
        opacity: 1;
        border-color: #1c2c4a;
      }
      #promptInput.expanded:focus {
        border-color: var(--accent);
      }
      #promptInput:disabled {
        opacity: 0.45;
      }

      /* Toggle de idioma de SAÍDA (fala da SARAH) — independente do
         idioma que o usuário fala/digita PRA ela, que é sempre
         auto-detectado. */
      #langToggle {
        display: flex;
        border: 1px solid #1c2c4a;
        border-radius: 19px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .lang-btn {
        border: none;
        background: transparent;
        color: #6b87ae;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        padding: 9px 13px;
        cursor: pointer;
      }
      .lang-btn.active {
        background: #163256;
        color: #9fd4ff;
      }
    </style>
  </head>
  <body>
    <div id="status-widget">
      <span id="status-time">--:--</span>
      <span id="status-date">--/--</span>
      <span class="sep"></span>
      <span id="status-weather-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4.5"></circle>
          <circle cx="12" cy="12" r="9" opacity="0.35"></circle>
        </svg>
        <span id="status-weather">--°C</span>
      </span>
      <span class="sep"></span>
      <span id="status-location">localização não disponível</span>
    </div>

    <div id="top">
      <div class="dash-col dash-col-left">
        <div class="panel" id="panel-integrations">
          <h2>Status das integrações</h2>
          <div class="body"></div>
        </div>
        <div class="panel" id="panel-risk">
          <h2>Proporção de risco</h2>
          <div class="body"></div>
        </div>
      </div>

      <div id="hologram-wrap" class="hud-corners">
        <canvas id="hologram"></canvas>
        <div id="core-task"></div>
        <div id="hologram-label">SARAH</div>
      </div>

      <div class="dash-col dash-col-right">
        <div class="panel" id="panel-categories">
          <h2>Atividade por categoria</h2>
          <div class="body"></div>
        </div>
        <div class="panel" id="panel-activity">
          <h2>Atividade recente (24h)</h2>
          <div class="body"></div>
        </div>
        <div class="panel" id="panel-errors">
          <h2>Erros recentes</h2>
          <div class="body"></div>
        </div>
      </div>
    </div>

    <div id="stage">
      <div id="stage-content" class="hint">
        Fale (🎙) ou digite (⌨) — a conversa completa fica no painel de Histórico (botão direito no ícone da barra de
        menu).
      </div>
    </div>

    <div id="controls">
      <button id="textToggleBtn" class="icon-btn" title="Digitar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="5.5" width="19" height="13" rx="2"></rect>
          <circle cx="6.5" cy="9" r="0.6" fill="currentColor" stroke="none"></circle>
          <circle cx="10" cy="9" r="0.6" fill="currentColor" stroke="none"></circle>
          <circle cx="13.5" cy="9" r="0.6" fill="currentColor" stroke="none"></circle>
          <circle cx="17" cy="9" r="0.6" fill="currentColor" stroke="none"></circle>
          <circle cx="6.5" cy="12" r="0.6" fill="currentColor" stroke="none"></circle>
          <circle cx="10" cy="12" r="0.6" fill="currentColor" stroke="none"></circle>
          <circle cx="13.5" cy="12" r="0.6" fill="currentColor" stroke="none"></circle>
          <circle cx="17" cy="12" r="0.6" fill="currentColor" stroke="none"></circle>
          <rect x="6.5" y="14.3" width="11" height="1.8" rx="0.6" fill="currentColor" stroke="none"></rect>
        </svg>
      </button>
      <input id="promptInput" type="text" placeholder="Peça algo pra SARAH..." />
      <button id="micBtn" class="icon-btn" title="Falar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="8" y1="22" x2="16" y2="22"></line>
        </svg>
      </button>
      <div id="langToggle">
        <button class="lang-btn active" data-lang="pt">PT</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
